name: ios

# Manual trigger only. Source is pulled from a private repo with a read-only deploy key;
# build outputs (simulator screenshot, unsigned ipa, log tail) are posted to a private endpoint,
# never uploaded as public artifacts.
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload to TestFlight
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26   # App Store Connect requires the iOS 26 SDK (Xcode 26); macos-15 defaults to Xcode 16 / iOS 18.5
    timeout-minutes: 75
    env:
      HAS_ASC_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CaspianLin/xiaowo-kmp
          ssh-key: ${{ secrets.KMP_DEPLOY_KEY }}
          path: kmp

      - name: Xcode version
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Kotlin frameworks
        working-directory: kmp
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :shared:linkDebugFrameworkIosSimulatorArm64 :shared:linkReleaseFrameworkIosArm64 2>&1 | tee ../build.log

      - name: Xcode project
        working-directory: kmp/iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Simulator build
        working-directory: kmp/iosApp
        run: |
          set -o pipefail
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a ../../build.log | tail -30

      - name: Screenshot
        run: |
          set -e
          APP=$(find kmp/iosApp/dd/Build/Products -maxdepth 2 -name '*.app' -path '*iphonesimulator*' | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BID"
          sleep 15
          xcrun simctl io "$UDID" screenshot shot.png
          # 闪退取证:进程还在不在 + 最近两分钟这个 App 的系统日志 + 崩溃报告,一起带回服务器
          { echo "== alive? =="; xcrun simctl spawn "$UDID" launchctl list | grep -i "$BID" || echo "NOT RUNNING";
            echo "== log =="; xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "iosApp"' 2>/dev/null | grep -iE 'error|exception|fault|crash|terminat|missing' | tail -60;
            echo "== crash reports =="; for f in $(ls -t ~/Library/Logs/DiagnosticReports/*iosApp* 2>/dev/null | head -2); do echo "--- $f"; head -120 "$f"; done; } > crash.txt 2>&1 || true

      - name: Device build (unsigned ipa)
        working-directory: kmp/iosApp
        run: |
          set -o pipefail
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee -a ../../build.log | tail -30
          APP=$(find dd2/Build/Products -maxdepth 2 -name '*.app' -path '*iphoneos*' | head -1)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry ../../app.ipa Payload
          ls -la ../../app.ipa

      - name: Signing setup
        env:
          IOS_P12: ${{ secrets.IOS_P12 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          set -e
          KC="$RUNNER_TEMP/sign.keychain-db"; KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$IOS_P12" | base64 --decode > "$RUNNER_TEMP/c.p12"
          security import "$RUNNER_TEMP/c.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC" >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/c.p12"
          printf '%s' "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/p.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/p.mobileprovision" > "$RUNNER_TEMP/p.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/p.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/p.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Signed archive + export
        working-directory: kmp/iosApp
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          BID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/p.plist" | sed 's/^[^.]*\.//')
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd3 \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" PRODUCT_BUNDLE_IDENTIFIER="$BID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee -a ../../build.log | tail -30
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BID</key><string>$PROFILE_UUID</string></dict>
            <key>uploadSymbols</key><false/>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" 2>&1 | tee -a ../../build.log | tail -20
          cp "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" ../../signed.ipa
          ls -la ../../signed.ipa

      # TestFlight: individual App Store Connect API key (JWT sub=user, no issuer id). altool doesn't take
      # individual keys, so this goes through the Build Uploads REST API via the asc CLI. Skipped until the key exists.
      - name: TestFlight upload
        if: env.HAS_ASC_KEY == 'true' && inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_BYPASS_KEYCHAIN: '1'
          ASC_TELEMETRY_DISABLED: '1'
        run: |
          set -o pipefail
          curl -fsSL https://asccli.sh/install | bash
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"
          (umask 077; printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8")
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          asc auth login --bypass-keychain --name ci --key-id "$ASC_KEY_ID" --key-type individual --private-key "$RUNNER_TEMP/AuthKey.p8"
          asc builds upload --app "$ASC_APP_ID" --ipa signed.ipa --wait --output json 2>&1 | tee testflight.txt | tail -40
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Drop
        if: always()
        env:
          DROP_URL: ${{ secrets.DROP_URL }}
          DROP_TOKEN: ${{ secrets.DROP_TOKEN }}
        run: |
          SHA=$(git -C kmp rev-parse --short HEAD 2>/dev/null || echo x)
          RUN=${{ github.run_number }}
          drop() { [ -f "$1" ] && curl -sS -X POST "$DROP_URL?name=$2" -H "x-drop-token: $DROP_TOKEN" -H 'Content-Type: application/octet-stream' --data-binary @"$1" -o /dev/null -w "$2 %{http_code}\n" || true; }
          tail -c 200000 build.log > log-tail.txt 2>/dev/null || true
          drop shot.png "r$RUN-$SHA-shot.png"
          drop app.ipa "r$RUN-$SHA-caspian.ipa"
          drop log-tail.txt "r$RUN-$SHA-log.txt"
          drop signed.ipa "r$RUN-$SHA-signed.ipa"
          drop testflight.txt "r$RUN-$SHA-testflight.txt"
          drop crash.txt "r$RUN-$SHA-crash.txt"
